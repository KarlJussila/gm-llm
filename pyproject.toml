[build-system]
# hatchling builds the wheel straight from the tree. setuptools staged it in the clone's build/
# and never pruned that, so a file deleted upstream kept shipping until someone cleared it.
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gm-llm"
# Single source of truth: gm_llm/__init__.py `__version__` (read by [tool.hatch.version]).
# Bump it there only; the CLI (`gm-llm --version`), `gm-llm update`, and this package's
# metadata all resolve from it, so they can never drift.
dynamic = ["version"]
description = "An LLM game master for solo, long-form D&D campaigns — over opencode."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "rich>=13",
    "textual>=0.60",
]

[project.scripts]
gm-llm = "gm_llm.cli:main"

[tool.hatch.version]
path = "gm_llm/__init__.py"

[tool.hatch.build.targets.wheel]
# One top-level package: the tool (gm_llm) with the orchestrator, the engine and the TUI
# beneath it, and its runtime data — the orchestrator's prompts and the opencode assets
# `gm-llm init` copies. Git-ignored files never ship. bench/ is workshop tooling that needs
# dev/fixtures/, so like dev/ it stays out.
packages = ["gm_llm"]
exclude = ["gm_llm/bench"]
